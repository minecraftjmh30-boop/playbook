<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBook - Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/lumen/bootstrap.min.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app" class="d-flex flex-column min-vh-100">
    <app-header></app-header>

    <main class="container my-5 flex-grow-1">
        <!-- Profile Tabs Navigation -->
        <ul class="nav nav-tabs mb-4" id="profileTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="main-tab" data-bs-toggle="tab" data-bs-target="#main-pane" type="button" role="tab">Main</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="friends-tab" data-bs-toggle="tab" data-bs-target="#friends-pane" type="button" role="tab">Friends</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings-pane" type="button" role="tab">Settings</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="profileTabsContent">
            <!-- Main Section: Basic Info -->
            <div class="tab-pane fade show active" id="main-pane" role="tabpanel">
                <profile-info :user-info="userInfo"></profile-info>
            </div>

            <!-- Friends Section -->
            <div class="tab-pane fade" id="friends-pane" role="tabpanel">
                <profile-friends 
                    :friends="friends" 
                    :pending-requests="pendingRequests" 
                    :friend-code="friendCode" 
                    @remove-friend="removeFriend" 
                    @handle-request="handlePendingRequest" 
                    @add-friend="addFriend">
                </profile-friends>
            </div>

            <!-- Settings Section -->
            <div class="tab-pane fade" id="settings-pane" role="tabpanel">
                <profile-settings></profile-settings>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <change-username-modal></change-username-modal>
    <change-password-modal></change-password-modal>
    <forgot-password-modal></forgot-password-modal>

    <app-footer></app-footer>

    <script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- components -->
    <script src="js/components/main/header.js"></script>
    <script src="js/components/main/footer.js"></script>
    <script src="js/components/profile/profileInfo.js"></script>
    <script src="js/components/profile/profileFriends.js"></script>
    <script src="js/components/profile/profileSettings.js"></script>
    <script src="js/components/modals/changeUsernameModal.js"></script>
    <script src="js/components/modals/changePasswordModal.js"></script>
    <script src="js/components/modals/forgotPasswordModal.js"></script>
    <script src="js/core/darkmode.js"></script>
    <script src="js/features/profile/profile.js"></script>
</body>
</html>
