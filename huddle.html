<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huddle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/lumen/bootstrap.min.css">
    <link rel="stylesheet" href="./css/schedule.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app" class="d-flex flex-column min-vh-100">
    <app-header></app-header>

    <main class="container my-4 flex-grow-1">
        <div class="row">
            <!-- Left Column: Mini Schedule and Participants -->
            <div class="col-md-4">
                <!-- Section 1: Mini Schedule -->
                <div class="card mb-4">
                    <div class="card-header">Huddle Schedule</div>
                    <div class="card-body">
                        <schedule-calendar 
                            :month-info="monthInfo" 
                            :displayed-days="displayedDays" 
                            :is-current-month="isCurrentMonth" 
                            :interactive="false"
                            :overlay-status="getOverlayStatus"
                            :selected-dates="huddle.selectedDates || []"
                            @change-month="changeMonth"
                            @day-click="handleDayClick">
                        </schedule-calendar>
                    </div>
                </div>

                <!-- Planned Dates Section -->
                <div class="card mb-4" v-if="huddle.selectedDates && huddle.selectedDates.length > 0">
                    <div class="card-header">Planned Dates</div>
                    <ul class="list-group list-group-flush">
                        <li v-for="date in huddle.selectedDates" :key="date" class="list-group-item">
                            {{ date }}
                        </li>
                    </ul>
                </div>

                <!-- Section 3: Participants -->
                <huddle-participants 
                    :participants="participants" 
                    :owner-id="huddle.owner"
                    :current-user="currentUser"
                    @remove-participant="removeParticipant">
                </huddle-participants>
            </div>

            <!-- Right Column: Huddle Description and Group Chat -->
            <div class="col-md-8">
                <!-- Section 2: Huddle Details -->
                <huddle-details 
                    :huddle="huddle" 
                    :current-user="currentUser"
                    @save="saveHuddleData">
                </huddle-details>

                <!-- Section 4: Group Chat -->
                <huddle-chat :messages="messages" :current-user="currentUser" @send-message="sendMessage"></huddle-chat>
            </div>
        </div>
    </main>

    <!-- Huddle Schedule Overlay Modal -->
    <div v-if="showOverlayModal" class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Schedule for {{ overlayDate }}</h5>
                    <button type="button" class="btn-close" @click="closeOverlayModal"></button>
                </div>
                <div class="modal-body">
                    <div v-if="overlayData.length === 0" class="text-muted text-center">
                        No schedule data available for this date.
                    </div>
                    <div v-else>
                        <div v-for="(detail, index) in overlayData" :key="index" class="mb-2 p-2 border rounded">
                            <strong>{{ detail.participant }}</strong>
                            <span :class="['badge', detail.mode === 'free' ? 'bg-success' : detail.mode === 'busy' ? 'bg-danger' : 'bg-secondary']">
                                {{ detail.mode || 'undetermined' }}
                            </span>
                            <span v-if="detail.startTime" class="ms-2">{{ detail.startTime }} - {{ detail.endTime }}</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" @click="closeOverlayModal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <app-footer></app-footer>

    <!-- Dependencies -->
    <script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- components -->
    <script src="js/components/main/header.js"></script>
    <script src="js/components/main/footer.js"></script>
    <script src="js/components/huddle/huddleDetails.js"></script>
    <script src="js/components/huddle/huddleParticipants.js"></script>
    <script src="js/components/huddle/huddleChat.js"></script>
    <script src="js/components/schedule/scheduleCalendar.js"></script>
    <script src="js/core/darkmode.js"></script>
    <!-- Huddle and Schedule logic -->
    <script src="js/features/huddles/huddle.js"></script>
</body>
</html>
