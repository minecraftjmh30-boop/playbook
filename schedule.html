<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule</title>
    <link href="https://unpkg.com/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/schedule.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app">
    <header>
    </header>
    <main class="container my-4">
        <section class="row justify-content-center gap-2 mb-4" id="tools">
            <button type="button" class="btn col-auto px-4 rounded-pill" :class="{'btn-success active': mode === 'free', 'btn-success': mode !== 'free'}" @click="setMode('free')">Quick Free</button>
            <button type="button" class="btn col-auto px-4 rounded-pill" :class="{'btn-danger active': mode === 'busy', 'btn-danger': mode !== 'busy'}" @click="setMode('busy')">Quick Busy</button>
            <button type="button" class="btn col-auto px-4 rounded-pill" :class="{'btn-secondary active': mode === 'remove', 'btn-secondary': mode !== 'remove'}" @click="setMode('remove')">Quick Remove</button>
        </section>

        <div class="row justify-content-center align-items-center mb-3">
            <button class="btn btn-sm btn-outline-primary me-3" @click="changeMonth(-1)">&lt; Prev</button>
            <h3 class="mb-0">{{ monthInfo.month }} / {{ monthInfo.year }}</h3>
            <button class="btn btn-sm btn-outline-primary ms-3" @click="changeMonth(1)">Next &gt;</button>
        </div>

        <div class="weekdayTable mb-2" id="weekdays">
            <div class="row text-center fw-bold">
                <div class="col">Sun</div>
                <div class="col">Mon</div>
                <div class="col">Tue</div>
                <div class="col">Wed</div>
                <div class="col">Thu</div>
                <div class="col">Fri</div>
                <div class="col">Sat</div>
            </div>
        </div>

        <section id="schedule" class="scheduleTable">
            <div class="row g-0" v-for="(day, index) in displayedDays" :key="index">
                <!-- Filler Day -->
                <div v-if="day.type === 'filler'" class="col border-0 opacity-0">
                    <div class="date"><p>skipped</p></div>
                </div>

                <!-- Actual Day -->
                <div v-else 
                     class="col date" 
                     :class="{
                        'disabled': day.isPast,
                        'currentDate': day.isToday,
                        'free': day.mode === 'free' || day.isFree,
                        'busy': day.mode === 'busy' || day.isBusy,
                        'currentDateFree': day.isToday && day.mode === 'free',
                        'currentDateBusy': day.isToday && day.mode === 'busy'
                     }"
                     @click="handleDayClick(day)">
                    <p class="dateTitle">{{ day.day }}</p>
                    <div v-if="day.mode" class="day-info">
                        <small>{{ day.startTime }} - {{ day.endTime }}</small>
                    </div>
                </div>
            </div>
        </section>

        <section class="row justify-content-center gap-2 mt-4">
            <button class="btn btn-secondary col-auto px-4 rounded-pill" type="button" @click="resetSchedule">Reset</button>
            <button class="btn btn-primary col-auto px-4 rounded-pill" type="button">Save</button>
        </section>
    </main>

    <footer>
    </footer>

    <!-- Modal for setting specific times -->
    <div class="modal fade show d-block" v-if="showTimeModal" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Set Time Range</h5>
                    <button type="button" class="btn-close" @click="closeModal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select class="form-select" v-model="modalData.mode">
                            <option value="free">Free</option>
                            <option value="busy">Busy</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Start Time</label>
                            <input type="time" class="form-control" v-model="modalData.startTime">
                        </div>
                        <div class="col">
                            <label class="form-label">End Time</label>
                            <input type="time" class="form-control" v-model="modalData.endTime">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" @click="closeModal">Cancel</button>
                    <button type="button" class="btn btn-primary" @click="saveTime">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!--dependencies-->
    <script
            src="https://unpkg.com/vue@3/dist/vue.global.js">
    </script>
    <script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--page scripts-->
    <script type="module" src="/js/eachPage/header/generateHeader.js"></script>
    <script type="module" src="/js/eachPage/footer/generateFooter.js"></script>
    <script type="module" src="/js/eachPage/prefrences/darkmode.js"></script>
    <!--schedule scripts-->
    <script src="/js/schedulePage/scheduleApp.js"></script>
</body>
</html>
