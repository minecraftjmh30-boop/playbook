<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/lumen/bootstrap.min.css">
    <link rel="stylesheet" href="./css/schedule.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app" class="d-flex flex-column min-vh-100">
    <header>
    </header>
    <main class="container my-4 flex-grow-1">
        <section class="row justify-content-center gap-2 mb-4" id="tools">
            <button type="button" id="freeBtn" class="btn btn-success col-auto px-4 rounded-pill" :class="{ active: mode === 'free' }" @click="setMode('free')">Quick Free</button>
            <button type="button" id="busyBtn" class="btn btn-danger col-auto px-4 rounded-pill" :class="{ active: mode === 'busy' }" @click="setMode('busy')">Quick Busy</button>
            <button type="button" id="removeBtn" class="btn btn-secondary col-auto px-4 rounded-pill" :class="{ active: mode === 'remove' }" @click="setMode('remove')">Quick Remove</button>
        </section>

        <div class="row justify-content-center align-items-center mb-3">
            <button class="btn btn-outline-secondary col-auto px-3 rounded-pill" :class="{ invisible: isCurrentMonth }" @click="changeMonth(-1)"> &#8592; </button>
            <h3 class="col-auto text-center mx-3 my-0">{{ monthInfo.monthName }} {{ monthInfo.year }}</h3>
            <button class="btn btn-outline-secondary col-auto px-3 rounded-pill" @click="changeMonth(1)"> &#8594; </button>
        </div>

        <div class="weekdayTable mb-2" id="weekdays">
            <div class="weekday">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday">Sat</div>
        </div>

        <section id="schedule" class="scheduleTable">
            <template v-for="(day, index) in displayedDays" :key="index">
                <!-- Filler Day -->
                <div v-if="day.type === 'filler'" class="date dateSkipped opacity-0">
                    <div><p>skipped</p></div>
                </div>

                <!-- Actual Day -->
                <div v-else 
                     class="date" 
                     :class="{
                        'disabled': day.isPast,
                        'currentDate': day.isToday,
                        'free': day.mode === 'free' || day.isFree,
                        'busy': day.mode === 'busy' || day.isBusy,
                        'currentDateFree': day.isToday && (day.mode === 'free' || day.isFree),
                        'currentDateBusy': day.isToday && (day.mode === 'busy' || day.isBusy),
                        'splitDate': day.startTime && day.endTime
                     }"
                     @click="handleDayClick(day)">
                    <p class="dateTitle">{{ day.day }}</p>
                </div>
            </template>
        </section>

        <section class="row justify-content-center gap-2 mt-4">
            <button class="btn btn-secondary col-auto px-4 rounded-pill" type="button" @click="resetSchedule">Reset</button>
            <button class="btn btn-primary col-auto px-4 rounded-pill" type="button">Save</button>
        </section>
    </main>

    <footer class="mt-auto">
    </footer>

    <!-- Modal for setting specific times -->
    <div class="modal fade show d-block" v-if="showTimeModal" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Set Time Range</h5>
                    <button type="button" class="btn-close" @click="closeModal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select class="form-select" v-model="modalData.mode">
                            <option value="free">Free</option>
                            <option value="busy">Busy</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Start Time</label>
                            <input type="time" class="form-control" v-model="modalData.startTime">
                        </div>
                        <div class="col">
                            <label class="form-label">End Time</label>
                            <input type="time" class="form-control" v-model="modalData.endTime">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" @click="closeModal">Cancel</button>
                    <button type="button" class="btn btn-primary" @click="saveTime">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!--dependencies-->
    <script
            src="https://unpkg.com/vue@3/dist/vue.global.js">
    </script>
    <script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--page scripts-->
    <script type="module" src="/js/eachPage/header/generateHeader.js"></script>
    <script type="module" src="/js/eachPage/footer/generateFooter.js"></script>
    <script type="module" src="/js/eachPage/prefrences/darkmode.js"></script>
    <!--schedule scripts-->
    <script src="/js/features/schedule/schedule.js"></script>
</body>
</html>
