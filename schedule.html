<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/lumen/bootstrap.min.css">
    <link rel="stylesheet" href="./css/schedule.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app" class="d-flex flex-column min-vh-100">
    <app-header></app-header>
    <main class="container my-4 flex-grow-1">
        <schedule-tools :mode="mode" @set-mode="setMode"></schedule-tools>

        <schedule-calendar 
            :month-info="monthInfo" 
            :displayed-days="displayedDays" 
            :is-current-month="isCurrentMonth" 
            :interactive="true" 
            @change-month="changeMonth" 
            @day-click="handleDayClick">
        </schedule-calendar>

        <section class="row justify-content-center gap-2 mt-4">
            <button class="btn btn-secondary col-auto px-4 rounded-pill" type="button" @click="resetSchedule">Reset</button>
            <button class="btn btn-primary col-auto px-4 rounded-pill" type="button" @click="saveSchedule">Save</button>
        </section>
    </main>

    <app-footer></app-footer>

    <!-- Modal for setting specific times -->
    <time-range-modal :show="showTimeModal" :modal-data="modalData" @close="closeModal" @save="saveTime"></time-range-modal>

    <!--dependencies-->
    <script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--components-->
    <script src="js/components/main/header.js"></script>
    <script src="js/components/main/footer.js"></script>
    <script src="js/components/schedule/scheduleTools.js"></script>
    <script src="js/components/schedule/scheduleCalendar.js"></script>
    <script src="js/components/modals/timeRangeModal.js"></script>
    <!--page scripts-->
    <script src="js/core/darkmode.js"></script>
    <!--schedule scripts-->
    <script src="js/features/schedule/schedule.js"></script>
</body>
</html>
