<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBook</title>
    <link href="https://unpkg.com/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app" class="d-flex flex-column min-vh-100">
<header>
</header>
<section id="hero" class="bg-primary text-white py-5 mb-4">
</section>
<main class="flex-grow-1">
    <section>

    </section>
<header>
    <div class="container d-flex justify-content-between align-items-center">
        <h1>My Rooms</h1>
        <button class="btn btn-success" @click="openAddModal">Add Room</button>
    </div>
</header>
<section id="rooms">
    <div class="container my-4">
        <div class="row">
            <!-- Room Card -->
            <div class="col-md-4" v-for="room in rooms" :key="room.id">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0">{{ room.name }}</h5>
                            <span :class="['badge', room.status === 'Online' ? 'bg-success' : 'bg-secondary']">{{ room.status }}</span>
                        </div>
                        <p class="card-text text-muted">{{ room.description }}</p>
                        <div class="d-flex justify-content-between">
                            <a href="room.html" class="btn btn-primary btn-sm">Go to Room</a>
                            <div v-if="room.status === 'Completed'">
                                <button class="btn btn-danger btn-sm" @click="leaveRoom(room)">Leave</button>
                            </div>
                            <div v-else>
                                <button class="btn btn-warning btn-sm me-1" @click="editRoom(room)">Edit</button>
                                <button class="btn btn-danger btn-sm" @click="deleteRoom(room.id)">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div v-if="rooms.length === 0" class="text-center text-muted">
            No rooms available. Add one!
        </div>
    </div>
</section>

<!-- Modal for Add/Edit Room -->
<div v-if="showModal" class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ isEditMode ? 'Edit Room' : 'Add New Room' }}</h5>
                <button type="button" class="btn-close" @click="closeModal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" v-model="currentRoom.name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" v-model="currentRoom.description"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" v-model="currentRoom.status">
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="closeModal">Cancel</button>
                <button type="button" class="btn btn-primary" @click="saveRoom">Save</button>
            </div>
        </div>
    </div>
</div>
</main>
<footer>

</footer>
<!--dependencies-->
<script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!--eachpage-->
<script type="module" src="/js/eachPage/header/generateHeader.js"></script>
<script type="module" src="/js/eachPage/footer/generateFooter.js"></script>
<script type="module" src="/js/eachPage/hero/generateHero.js"></script>
<script src="/js/eachPage/prefrences/darkmode.js"></script>
<!--Rooms-->
<script src="/js/app.js"></script>

</body>
</html>
