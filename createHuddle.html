<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Huddle</title>
    <!-- Bootswatch Lumen CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/lumen/bootstrap.min.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app" class="d-flex flex-column min-vh-100">
    <app-header></app-header>
    <header class="bg-primary text-white py-3 mb-4">
        <div class="container">
            <h1>Create a New Huddle</h1>
        </div>
    </header>

    <main class="container flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <form @submit.prevent="handleSubmit">
                            <div class="mb-3">
                                <label for="name" class="form-label">Huddle Name</label>
                                <input type="text" class="form-control" id="name" v-model="huddle.name" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3" v-model="huddle.description" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" v-model="huddle.location" required>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="index.html" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Create Huddle</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <app-footer></app-footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- components -->
    <script src="/js/components/components.js"></script>
    <script src="/js/eachPage/prefrences/darkmode.js"></script>
    <!-- App Logic -->
    <script src="/js/features/huddles/create-huddle.js"></script>
</body>
</html>
