<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBook</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/lumen/bootstrap.min.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body id="app" class="d-flex flex-column min-vh-100">
    <header class="bg-primary-subtle"><h2 class="container">PlayBook</h2></header>
    <main class="container flex-grow-1">
        <header>
            <h1>Welcome!</h1>
        </header>
        <form @submit.prevent="handleSubmit" novalidate>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input 
                    type="email" 
                    class="form-control" 
                    :class="{'is-invalid': submitted && formErrors.email, 'is-valid': submitted && !formErrors.email && email}"
                    v-model="email" 
                    required
                    placeholder="Enter your email">
                <div class="invalid-feedback">{{ formErrors.email }}</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input 
                    type="password" 
                    class="form-control" 
                    :class="{'is-invalid': submitted && formErrors.password, 'is-valid': submitted && !formErrors.password && password}"
                    v-model="password" 
                    required
                    placeholder="Enter your password">
                <div class="invalid-feedback">{{ formErrors.password }}</div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2" id="login">Login</button>
            <div class="text-center my-2">OR</div>
            <button type="button" class="btn btn-outline-secondary w-100" id="signup" @click="handleSignup">Sign-Up</button>
        </form>
    </main>
    <app-footer></app-footer>

    <script src="https://unpkg.com/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- components -->
    <script src="js/components/main/footer.js"></script>
    <script src="js/core/darkmode.js"></script>
    <!-- Utilities and Toast -->
    <script src="js/core/utils.js"></script>
    <script src="js/components/ui/toast.js"></script>
    <!-- Login App -->
    <script src="js/features/auth/login.js"></script>
</body>
</html>
